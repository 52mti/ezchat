<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="2380" viewBox="0 0 1760 2380" role="img" aria-labelledby="title desc">
  <title id="title">欢友自动化整体运行流程</title>
  <desc id="desc">欢友自动化完整流程图，包含外层 DeviceWorker 调度、配置与人设加载、MessageProcessor/AIClient 回复链路、HuanyouApp 单轮业务、空闲维护、异常恢复与返回列表。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24424f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16313a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f4efe5; }
      .title { font: 700 36px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17333b; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5c6b70; }
      .lane-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17333b; }
      .node { filter: url(#shadow); stroke-width: 2; }
      .start { fill: #1f5a64; stroke: #173f47; }
      .process { fill: #ffffff; stroke: #78909c; }
      .ocr { fill: #ecf7f2; stroke: #3f8b72; }
      .action { fill: #fff2d8; stroke: #d09327; }
      .decision { fill: #ffffff; stroke: #b36a3c; }
      .warning { fill: #fff0ef; stroke: #c7564d; }
      .idle { fill: #eef2ff; stroke: #6477c4; }
      .ai { fill: #f0ebff; stroke: #8064c8; }
      .end { fill: #263943; stroke: #17333b; }
      .node-text { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17333b; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4d6067; text-anchor: middle; dominant-baseline: middle; }
      .white-text { fill: #ffffff; }
      .edge { fill: none; stroke: #24424f; stroke-width: 2.4; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #6f7d83; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24424f; paint-order: stroke; stroke: #f4efe5; stroke-width: 5; stroke-linejoin: round; }
      .note { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5c6b70; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1760" height="2380"/>
  <text class="title" x="880" y="54" text-anchor="middle">欢友自动化整体运行流程</text>
  <text class="subtitle" x="880" y="84" text-anchor="middle">当前代码真实链路：DeviceWorker 调度、人设合并、MessageProcessor/AIClient、list 白字红点未读、新招呼保存范围检测、下一条校验、切到新人后循环回复、空闲防熄屏、异常恢复</text>

  <rect x="46" y="112" width="360" height="38" rx="19" fill="#e5ecf8" stroke="#b8c4df"/>
  <text class="lane-title" x="226" y="136" text-anchor="middle">外层调度与配置</text>
  <rect x="470" y="112" width="480" height="38" rx="19" fill="#e3f3eb" stroke="#a8d0bd"/>
  <text class="lane-title" x="710" y="136" text-anchor="middle">HuanyouApp 单轮主流程</text>
  <rect x="1040" y="112" width="390" height="38" rx="19" fill="#fff0d9" stroke="#dbba83"/>
  <text class="lane-title" x="1235" y="136" text-anchor="middle">聊天处理分支</text>
  <rect x="1480" y="112" width="240" height="38" rx="19" fill="#eee8ff" stroke="#b8a8df"/>
  <text class="lane-title" x="1600" y="136" text-anchor="middle">AI 回复链路</text>

  <!-- Outer DeviceWorker flow -->
  <g>
    <rect class="node start" x="70" y="180" width="300" height="64" rx="22"/>
    <text class="node-text white-text" x="220" y="212">DeviceWorker 启动</text>
  </g>
  <g>
    <rect class="node process" x="48" y="286" width="344" height="116" rx="18"/>
    <text class="node-text" x="220" y="314">加载配置与运行对象</text>
    <text class="node-sub" x="220" y="340">get_app_config(device, huanyou)</text>
    <text class="node-sub" x="220" y="362">创建 RobotInterface / AIClient</text>
    <text class="node-sub" x="220" y="384">创建 MessageProcessor / MemoryStore</text>
  </g>
  <g>
    <rect class="node ai" x="48" y="444" width="344" height="130" rx="18"/>
    <text class="node-text" x="220" y="474">人设配置来源</text>
    <text class="node-sub" x="220" y="500">global.persona</text>
    <text class="node-sub" x="220" y="522">device.persona</text>
    <text class="node-sub" x="220" y="544">devices[].app_overrides.huanyou.persona</text>
    <text class="node-sub" x="220" y="566">contact_personas[contact]</text>
  </g>
  <g>
    <rect class="node process" x="48" y="616" width="344" height="116" rx="18"/>
    <text class="node-text" x="220" y="644">创建 HuanyouApp</text>
    <text class="node-sub" x="220" y="670">传入 app_config</text>
    <text class="node-sub" x="220" y="692">reply_provider = prepare_reply</text>
    <text class="node-sub" x="220" y="714">sent_callback = mark_sent</text>
  </g>
  <g>
    <rect class="node process" x="48" y="774" width="344" height="116" rx="18"/>
    <text class="node-text" x="220" y="802">运行前门控</text>
    <text class="node-sub" x="220" y="828">pause 阻塞；stop 退出</text>
    <text class="node-sub" x="220" y="850">license 校验失败 pause</text>
    <text class="node-sub" x="220" y="872">缺返回模板直接停止启动</text>
  </g>
  <g>
    <rect class="node idle" x="48" y="932" width="344" height="116" rx="18"/>
    <text class="node-text" x="220" y="960">轮询与状态上报</text>
    <text class="node-sub" x="220" y="986">每轮调用 HuanyouApp.run_once()</text>
    <text class="node-sub" x="220" y="1008">结束后发送 tick/status</text>
    <text class="node-sub" x="220" y="1030">empty_list_target 使用慢轮询</text>
  </g>
  <g>
    <rect class="node warning" x="48" y="1090" width="344" height="92" rx="18"/>
    <text class="node-text" x="220" y="1118">熔断与停止</text>
    <text class="node-sub" x="220" y="1144">is_circuit_open=true → circuit open</text>
    <text class="node-sub" x="220" y="1166">worker pause 当前设备</text>
  </g>

  <!-- Main Huanyou flow -->
  <g>
    <rect class="node start" x="560" y="180" width="300" height="64" rx="22"/>
    <text class="node-text white-text" x="710" y="212">run_once 开始</text>
  </g>
  <g>
    <rect class="node process" x="520" y="286" width="380" height="88" rx="18"/>
    <text class="node-text" x="710" y="314">截图前安全位 / 关闭弹窗</text>
    <text class="node-sub" x="710" y="340">capture_after_popups(pre_move=true)</text>
    <text class="node-sub" x="710" y="360">每次截图前后优先处理弹窗</text>
  </g>
  <g>
    <rect class="node process" x="520" y="416" width="380" height="106" rx="18"/>
    <text class="node-text" x="710" y="444">启动/复扫先回聊天列表</text>
    <text class="node-sub" x="710" y="470">预设界面：聊天列表 / 聊天界面 / 我的界面</text>
    <text class="node-sub" x="710" y="492">聊天/我的/未知页先返回，再做 list OCR</text>
    <text class="node-sub" x="710" y="512">黑屏 / 无手机在此分流</text>
  </g>
  <g>
    <rect class="node ocr" x="520" y="564" width="380" height="108" rx="18"/>
    <text class="node-text" x="710" y="592">列表 OCR 扫描</text>
    <text class="node-sub" x="710" y="618">list 模式识别 message_list / bottom_nav</text>
    <text class="node-sub" x="710" y="640">未读：左侧圆形红点 + 白字/相对白字 → unread=1</text>
    <text class="node-sub" x="710" y="660">搜索高度 0.05；排除在线配对 / 福利多多等入口</text>
  </g>
  <g>
    <rect class="node action" x="520" y="714" width="380" height="84" rx="18"/>
    <text class="node-text" x="710" y="742">连点底部“消息”两次</text>
    <text class="node-sub" x="710" y="768">使用最近 list OCR 的 bottom_nav 坐标</text>
  </g>
  <g>
    <rect class="node ocr" x="520" y="840" width="380" height="76" rx="18"/>
    <text class="node-text" x="710" y="868">列表 OCR 复扫</text>
    <text class="node-sub" x="710" y="892">复扫后才确定未回复用户坐标</text>
  </g>
  <g>
    <path class="node decision" d="M710 960 L880 1036 L710 1112 L540 1036 Z"/>
    <text class="node-text" x="710" y="1028">有未读目标？</text>
    <text class="node-sub" x="710" y="1054">unread_count &gt; 0</text>
  </g>
  <g>
    <rect class="node action" x="520" y="1160" width="380" height="100" rx="18"/>
    <text class="node-text" x="710" y="1188">选择目标并进入聊天</text>
    <text class="node-sub" x="710" y="1214">候选：未读行</text>
    <text class="node-sub" x="710" y="1236">排序：favorability 高优先，其次靠上</text>
    <text class="node-sub" x="710" y="1250">点击 bounds 中心</text>
  </g>
  <g>
    <rect class="node process" x="520" y="1302" width="380" height="76" rx="18"/>
    <text class="node-text" x="710" y="1330">确认聊天界面</text>
    <text class="node-sub" x="710" y="1354">screen_聊天界面模板匹配</text>
  </g>
  <g>
    <path class="node decision" d="M710 1420 L880 1496 L710 1572 L540 1496 Z"/>
    <text class="node-text" x="710" y="1488">有“新招呼”？</text>
    <text class="node-sub" x="710" y="1514">btn_新招呼按钮；优先使用已保存范围</text>
  </g>

  <!-- Idle and abnormal branches -->
  <g>
    <rect class="node idle" x="520" y="1660" width="380" height="118" rx="18"/>
    <text class="node-text" x="710" y="1688">暂无消息：进入空闲维护</text>
    <text class="node-sub" x="710" y="1714">首次读取积分：点“我的” → points OCR</text>
    <text class="node-sub" x="710" y="1736">金币前数字 ÷ 10 上报主 UI</text>
    <text class="node-sub" x="710" y="1758">防熄屏：点击“消息”一次，期间复扫</text>
  </g>
  <g>
    <rect class="node warning" x="520" y="1818" width="380" height="122" rx="18"/>
    <text class="node-text" x="710" y="1848">异常界面处理</text>
    <text class="node-sub" x="710" y="1874">黑屏：状态栏提示，进程不停</text>
    <text class="node-sub" x="710" y="1896">无手机：命中 screen_无手机界面，停止进程</text>
    <text class="node-sub" x="710" y="1918">未知页：点击返回一次恢复</text>
  </g>

  <!-- Chat branch -->
  <g>
    <rect class="node action" x="1048" y="1414" width="390" height="90" rx="18"/>
    <text class="node-text" x="1243" y="1442">点击“新招呼”</text>
    <text class="node-sub" x="1243" y="1468">只跳过当前招呼的上滑和 dialogue</text>
    <text class="node-sub" x="1243" y="1488">点下一条后重新判断新联系人</text>
  </g>
  <g>
    <rect class="node ocr" x="1048" y="1544" width="390" height="120" rx="18"/>
    <text class="node-text" x="1243" y="1572">点击“下一条”并校验姓名</text>
    <text class="node-sub" x="1243" y="1598">dialogue 模式读取 user_name</text>
    <text class="node-sub" x="1243" y="1620">同名继续点；切人后回到聊天处理</text>
    <text class="node-sub" x="1243" y="1642">同时保留 user_name 坐标，用于收回输入框</text>
  </g>
  <g>
    <path class="node decision" d="M1243 1688 L1414 1764 L1243 1840 L1072 1764 Z"/>
    <text class="node-text" x="1243" y="1756">下一条结果？</text>
    <text class="node-sub" x="1243" y="1782">同名 / 新人 / 无下一条</text>
  </g>
  <g>
    <rect class="node action" x="1048" y="620" width="390" height="84" rx="18"/>
    <text class="node-text" x="1243" y="648">没有新招呼：先上滑</text>
    <text class="node-sub" x="1243" y="674">robot.swipe(0.5, 0.6 → 0.5, 0.3)</text>
  </g>
  <g>
    <rect class="node ocr" x="1048" y="746" width="390" height="98" rx="18"/>
    <text class="node-text" x="1243" y="774">聊天详情 OCR</text>
    <text class="node-sub" x="1243" y="800">dialogue 模式读取 sender1 最后一条</text>
    <text class="node-sub" x="1243" y="822">无 sender1 内容时按“你好”处理</text>
    <text class="node-sub" x="1243" y="838">日志显示：对方最后一句 / 兜底原因</text>
  </g>
  <g>
    <path class="node decision" d="M1243 888 L1414 964 L1243 1040 L1072 964 Z"/>
    <text class="node-text" x="1243" y="956">内容是“你好”？</text>
    <text class="node-sub" x="1243" y="982">清洗后判断</text>
  </g>
  <g>
    <rect class="node process" x="1048" y="1084" width="390" height="106" rx="18"/>
    <text class="node-text" x="1243" y="1112">生成回复</text>
    <text class="node-sub" x="1243" y="1138">是“你好”：从 pingtai.txt 抽一条</text>
    <text class="node-sub" x="1243" y="1160">其他内容：请求 AI 回复</text>
    <text class="node-sub" x="1243" y="1180">reply_provider 走 MessageProcessor</text>
  </g>
  <g>
    <rect class="node action" x="1048" y="1234" width="390" height="116" rx="18"/>
    <text class="node-text" x="1243" y="1262">语音输入并发送</text>
    <text class="node-sub" x="1243" y="1288">点输入框 x - 0.5 → 点麦克风</text>
    <text class="node-sub" x="1243" y="1310">TTS 播放回复；完成后等 3 秒</text>
    <text class="node-sub" x="1243" y="1332">匹配发送按钮并点击，必要时补点</text>
  </g>
  <g>
    <rect class="node warning" x="1048" y="1900" width="390" height="116" rx="18"/>
    <text class="node-text" x="1243" y="1930">下一条缺失 / 返回列表</text>
    <text class="node-sub" x="1243" y="1956">发送后无下一条：返回点两次</text>
    <text class="node-sub" x="1243" y="1978">新招呼后无下一条：返回点一次</text>
    <text class="node-sub" x="1243" y="2000">其他返回：单次模板返回</text>
  </g>
  <g>
    <rect class="node end" x="1058" y="2060" width="370" height="74" rx="22"/>
    <text class="node-text white-text" x="1243" y="2088">回到聊天列表 / 本轮结束</text>
    <text class="node-sub white-text" x="1243" y="2112">下一轮重新从弹窗和列表 OCR 开始</text>
  </g>

  <!-- AI provider branch -->
  <g>
    <rect class="node ai" x="1480" y="1018" width="240" height="124" rx="18"/>
    <text class="node-text" x="1600" y="1048">MessageProcessor</text>
    <text class="node-sub" x="1600" y="1074">prepare_reply(message)</text>
    <text class="node-sub" x="1600" y="1096">先查 outbox pending</text>
    <text class="node-sub" x="1600" y="1118">再合并 persona</text>
  </g>
  <g>
    <rect class="node ai" x="1480" y="1184" width="240" height="124" rx="18"/>
    <text class="node-text" x="1600" y="1214">记忆与会话</text>
    <text class="node-sub" x="1600" y="1240">MemoryStore 按设备/App/联系人</text>
    <text class="node-sub" x="1600" y="1262">和 persona_signature 取 conversation_id</text>
  </g>
  <g>
    <rect class="node ai" x="1480" y="1350" width="240" height="124" rx="18"/>
    <text class="node-text" x="1600" y="1380">AIClient.chat</text>
    <text class="node-sub" x="1600" y="1406">发送 content + persona + apikey</text>
    <text class="node-sub" x="1600" y="1428">requestPersona 优先作为 Bearer</text>
    <text class="node-sub" x="1600" y="1450">返回 reply_text / conversation_id</text>
  </g>
  <g>
    <rect class="node ai" x="1480" y="1516" width="240" height="104" rx="18"/>
    <text class="node-text" x="1600" y="1546">保存状态</text>
    <text class="node-sub" x="1600" y="1572">更新 MemoryStore</text>
    <text class="node-sub" x="1600" y="1594">写 outbox pending_send</text>
  </g>
  <g>
    <rect class="node ai" x="1480" y="1662" width="240" height="90" rx="18"/>
    <text class="node-text" x="1600" y="1692">发送成功回调</text>
    <text class="node-sub" x="1600" y="1718">mark_sent 清 pending_send</text>
  </g>

  <!-- Notes -->
  <g>
    <rect x="48" y="1260" width="392" height="388" rx="18" fill="#ffffff" stroke="#d3c7af"/>
    <text class="lane-title" x="72" y="1292">本次排查补充项</text>
    <text class="note" x="72" y="1324">1. 外层 DeviceWorker / license / pause / stop / tick 已补。</text>
    <text class="note" x="72" y="1352">2. 前端人设配置链路已补：app_overrides.huanyou.persona。</text>
    <text class="note" x="72" y="1380">3. MessageProcessor / MemoryStore / outbox / AIClient 已补。</text>
    <text class="note" x="72" y="1408">4. 黑屏：状态栏提示，进程继续轮询。</text>
    <text class="note" x="72" y="1436">5. 无手机：状态栏提示并打开 circuit 停止业务轮次。</text>
    <text class="note" x="72" y="1464">6. 未知界面：不在三大预设界面时，点击返回恢复。</text>
    <text class="note" x="72" y="1492">7. 新招呼：优先用 button.new_greeting 保存范围；无配置才兜底 85%。</text>
    <text class="note" x="72" y="1520">8. list 未读：圆形红点必须有白字；支持相对白字兜底。</text>
    <text class="note" x="72" y="1548">9. 正常回复后切人：复用校验姓名 OCR 的名字坐标收回输入框。</text>
    <text class="note" x="72" y="1576">10. 切到新人：重新判断新招呼；无新招呼则 OCR 回复后再点下一条。</text>
    <text class="note" x="72" y="1604">11. dialogue 无 sender1 内容：默认按“你好”走 pingtai.txt。</text>
    <text class="note" x="72" y="1632">12. 空闲：防熄屏只点“消息”一次；复扫前先归位聊天列表。</text>
  </g>

  <!-- Edges outer -->
  <path class="edge" d="M220 244 L220 286"/>
  <path class="edge" d="M220 402 L220 444"/>
  <path class="edge" d="M220 574 L220 616"/>
  <path class="edge" d="M220 732 L220 774"/>
  <path class="edge" d="M220 890 L220 932"/>
  <path class="edge" d="M220 1048 L220 1090"/>
  <path class="edge" d="M392 832 C455 832 455 212 560 212"/>
  <text class="label" x="418" y="800">调度 run_once</text>
  <path class="edge-soft" d="M392 508 C915 508 965 1080 1480 1080"/>
  <text class="label" x="822" y="532">人设供 AI 链路使用</text>

  <!-- Edges main -->
  <path class="edge" d="M710 244 L710 286"/>
  <path class="edge" d="M710 374 L710 416"/>
  <path class="edge" d="M710 522 L710 564"/>
  <path class="edge" d="M710 672 L710 714"/>
  <path class="edge" d="M710 798 L710 840"/>
  <path class="edge" d="M710 916 L710 960"/>
  <path class="edge" d="M710 1112 L710 1160"/>
  <path class="edge" d="M710 1260 L710 1302"/>
  <path class="edge" d="M710 1378 L710 1420"/>
  <path class="edge" d="M540 1036 C485 1036 485 1700 520 1700"/>
  <text class="label" x="500" y="1140">否</text>
  <path class="edge-soft" d="M520 1878 C420 1878 420 470 520 470"/>
  <text class="label" x="430" y="1850">异常恢复后重试</text>

  <!-- Edges chat -->
  <path class="edge" d="M880 1496 L1048 1459"/>
  <text class="label" x="936" y="1464">是</text>
  <path class="edge" d="M1243 1504 L1243 1544"/>
