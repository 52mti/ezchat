<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3000" viewBox="0 0 1600 3000" role="img" aria-labelledby="title desc">
  <title id="title">心遇自动化当前完整流程</title>
  <desc id="desc">心遇自动化从设备门控、原图转竖屏、透视和照片缓存，到导航扫描、消息列表识别、对话视觉识别、本地 OCR 融合、AI 回复、发送和异常等待恢复。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#294553"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17333b" flood-opacity=".15"/></filter>
    <style>
      .bg{fill:#f6f2ea}.title{font:700 34px "Microsoft YaHei",sans-serif;fill:#163740}.subtitle{font:400 16px "Microsoft YaHei",sans-serif;fill:#617078}.lane{font:700 18px "Microsoft YaHei",sans-serif;fill:#163740}.node{filter:url(#shadow);stroke-width:2}.start{fill:#1f5c67;stroke:#15434d}.process{fill:#fff;stroke:#78909c}.cache{fill:#eaf1ff;stroke:#627fbe}.ocr{fill:#e6f6ef;stroke:#39846c}.action{fill:#fff1d5;stroke:#d09226}.decision{fill:#fff;stroke:#b86b3b}.warning{fill:#fff0ee;stroke:#c65a51}.idle{fill:#eef2ff;stroke:#6477c4}.end{fill:#263d45;stroke:#183139}.t{font:600 16px "Microsoft YaHei",sans-serif;fill:#17333b;text-anchor:middle;dominant-baseline:middle}.s{font:400 13px "Microsoft YaHei",sans-serif;fill:#52646b;text-anchor:middle;dominant-baseline:middle}.w{fill:#fff}.edge{fill:none;stroke:#294553;stroke-width:2.5;marker-end:url(#arrow)}.soft{fill:none;stroke:#718087;stroke-width:2;stroke-dasharray:8 7;marker-end:url(#arrow)}.label{font:700 13px "Microsoft YaHei",sans-serif;fill:#294553;paint-order:stroke;stroke:#f6f2ea;stroke-width:5;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1600" height="3000"/>
  <text class="title" x="800" y="54" text-anchor="middle">心遇自动化当前完整流程</text>
  <text class="subtitle" x="800" y="84" text-anchor="middle">当前实现：原图转竖屏、透视作用域缓存、导航与消息列表分开识别、视觉模型与本地 OCR 融合、可恢复异常等待</text>
  <rect x="45" y="118" width="330" height="38" rx="19" fill="#e5ecf8" stroke="#b8c4df"/><text class="lane" x="210" y="142" text-anchor="middle">设备 Worker 门控与异常</text>
  <rect x="440" y="118" width="690" height="38" rx="19" fill="#e3f3eb" stroke="#a8d0bd"/><text class="lane" x="785" y="142" text-anchor="middle">心遇单轮主流程</text>
  <rect x="1190" y="118" width="365" height="38" rx="19" fill="#fff0d9" stroke="#dbba83"/><text class="lane" x="1372" y="142" text-anchor="middle">识别、缓存与恢复细节</text>

  <!-- 主流程：每一步都使用竖屏归一化坐标 -->
  <rect class="node start" x="570" y="190" width="430" height="64" rx="22"/><text class="t w" x="785" y="222">DeviceWorker.run_once 开始</text>
  <rect class="node process" x="510" y="290" width="550" height="92" rx="18"/><text class="t" x="785" y="318">运行门控与取消检查</text><text class="s" x="785" y="344">停止立即退出；暂停等待；已熔断不再执行；步骤中的 sleep / 点击前持续检查取消</text><text class="s" x="785" y="366">每台设备、每个 App 独立 Worker，可并行运行</text>
  <rect class="node cache" x="510" y="418" width="550" height="112" rx="18"/><text class="t" x="785" y="448">获取截图：原图 → 当前竖屏透视图</text><text class="s" x="785" y="474">读取机械臂原图，逆时针旋转 90° / 本地透视转换；OCR、找图和测试坐标统一用竖屏坐标</text><text class="s" x="785" y="498">透视参数不变：保留坐标缓存；原图相同：复用上轮 OCR / 模板匹配结果</text><text class="s" x="785" y="520">透视变化只清坐标相关缓存，照片变化只清识别结果缓存</text>
  <rect class="node process" x="510" y="566" width="550" height="108" rx="18"/><text class="t" x="785" y="596">首图界面确认与返回按钮门控</text><text class="s" x="785" y="622">先判断列表、聊天、我的或未知界面；每个 App 启动前必须找到返回按钮模板</text><text class="s" x="785" y="646">聊天页 / 我的页 / 未知页按专用纠偏路径回到消息列表；不误点击默认坐标</text><text class="s" x="785" y="666">找不到返回按钮：日志明确提示，当前轮停止，不执行危险复位</text>
  <rect class="node process" x="510" y="710" width="550" height="86" rx="18"/><text class="t" x="785" y="738">全局弹窗检测与关闭</text><text class="s" x="785" y="764">弹窗是唯一允许全图找图的类别；使用弹窗自己的模板、范围和阈值</text><text class="s" x="785" y="784">关闭后重新确认当前页面，再进入导航或消息列表流程</text>
  <path class="node decision" d="M785 836 L965 914 L785 992 L605 914 Z"/><text class="t" x="785" y="906">需要刷新导航坐标？</text><text class="s" x="785" y="932">首次进入、页面切换、缓存缺失或顶部筛选项位置可能变化</text>
  <rect class="node ocr" x="510" y="1030" width="550" height="110" rx="18"/><text class="t" x="785" y="1060">导航专用 OCR 扫描</text><text class="s" x="785" y="1086">顶部区域：全部消息 / 未回复 / 在线等筛选项，位置变化时重新取 bounds</text><text class="s" x="785" y="1110">底部区域：消息 / 我的等底部导航，保存当前点击坐标和导航区域</text><text class="s" x="785" y="1130">导航结果独立缓存，不混入 message_list</text>
  <rect class="node ocr" x="510" y="1180" width="550" height="112" rx="18"/><text class="t" x="785" y="1210">只识别聊天列表 message_list</text><text class="s" x="785" y="1236">使用顶部导航下方至底部导航上方的中间区域，不再重复扫描全屏</text><text class="s" x="785" y="1260">首次或动态范围无效时使用 App 固定 message_list 区域</text><text class="s" x="785" y="1280">成功后依据消息行 bounds 和底部导航位置更新 list_compact 动态区域</text>
  <path class="node decision" d="M785 1332 L965 1410 L785 1488 L605 1410 Z"/><text class="t" x="785" y="1402">识别到有效列表行？</text><text class="s" x="785" y="1428">动态区域为空、异常或没有有效行时重新使用完整列表区域校准</text>
  <rect class="node action" x="510" y="1528" width="550" height="94" rx="18"/><text class="t" x="785" y="1558">检查未回复 / 在线状态</text><text class="s" x="785" y="1584">使用本轮最新顶部导航 bounds；红点 / 红色像素判断是否需要点击切换</text><text class="s" x="785" y="1604">切换后重新截图，继续使用 message_list 中间区域识别</text>
  <path class="node decision" d="M785 1664 L965 1742 L785 1820 L605 1742 Z"/><text class="t" x="785" y="1734">找到可处理目标？</text><text class="s" x="785" y="1760">未读优先；再按好感度 / 内容选择；空占位不进入聊天</text>
  <rect class="node action" x="510" y="1860" width="550" height="94" rx="18"/><text class="t" x="785" y="1890">进入聊天并确认聊天界面</text><text class="s" x="785" y="1916">点击 message_list 行中心，截图确认聊天模板；记录目标名称、未读数和内容</text><text class="s" x="785" y="1936">黑屏 / 无手机是异常状态，但保持运行并等待用户恢复，不触发熔断</text>
  <path class="node decision" d="M785 1996 L965 2074 L785 2152 L605 2074 Z"/><text class="t" x="785" y="2066">有新招呼按钮？</text><text class="s" x="785" y="2092">有：点击新招呼，完成后匹配返回按钮回列表；无：继续对话识别</text>
  <rect class="node ocr" x="510" y="2192" width="550" height="118" rx="18"/><text class="t" x="785" y="2222">对话识别：视觉模型 + 本地 OCR</text><text class="s" x="785" y="2248">视觉模型判断真实对话、sender 和系统消息；次数按电脑 + 设备 + App + 透视参数持久化限制</text><text class="s" x="785" y="2272">本地 OCR 提供文字和 bounds；心遇规则过滤系统消息并校正可对应的文字</text><text class="s" x="785" y="2292">视觉识别失败 / 达到额度后继续本地 OCR，不阻塞其他设备线程</text>
  <rect class="node cache" x="510" y="2350" width="550" height="112" rx="18"/><text class="t" x="785" y="2380">动态更新对话区域与规则</text><text class="s" x="785" y="2406">根据 sender1 / sender2 对应的本地 OCR bounds 调整 chat_area 左右边界，输入框确定下边界</text><text class="s" x="785" y="2430">视觉确认的新系统消息追加到心遇 App 的 line_excluded_keywords</text><text class="s" x="785" y="2450">时间、奖励、积分等已有规则不追加；系统规则长期保留，动态范围随透视作用域变化</text>
  <rect class="node process" x="510" y="2502" width="550" height="112" rx="18"/><text class="t" x="785" y="2532">当前设备当前 App 的 AI 回复</text><text class="s" x="785" y="2558">使用该设备该 App 配置的人设授权 ID、聊天记忆和最近会话；不是全局默认人设</text><text class="s" x="785" y="2582">请求成功写入记忆 / outbox；异常保留可重试状态，不泄露密钥和聊天记录</text><text class="s" x="785" y="2602">无可回复内容：不点击发送，直接返回列表</text>
  <rect class="node action" x="510" y="2654" width="550" height="112" rx="18"/><text class="t" x="785" y="2684">输入、TTS、发送与返回</text><text class="s" x="785" y="2710">匹配输入框 → 输入文字或点击麦克风播放 TTS → 匹配发送按钮直到发送完成</text><text class="s" x="785" y="2734">每一步点击前检查停止信号；发送成功后记录消息记忆和已发送状态</text><text class="s" x="785" y="2754">匹配返回按钮回到列表，本轮成功结束</text>
  <rect class="node end" x="600" y="2810" width="370" height="66" rx="22"/><text class="t w" x="785" y="2842">tick / 等待下一轮</text>

  <!-- 外层 Worker 与异常 -->
  <rect class="node process" x="55" y="190" width="330" height="112" rx="18"/><text class="t" x="220" y="220">每台设备独立 Worker</text><text class="s" x="220" y="246">设备 IP + 当前 App 独立配置、状态、日志、缓存</text><text class="s" x="220" y="268">多设备 / 多 App 在线程或调度池中并行运行</text><text class="s" x="220" y="288">OCR 并发受全局可配置数量限制</text>
  <rect class="node idle" x="55" y="350" width="330" height="106" rx="18"/><text class="t" x="220" y="380">暂无目标 / 空列表</text><text class="s" x="220" y="406">不计为错误；按空闲轮询间隔等待</text><text class="s" x="220" y="428">定时防熄屏、必要时读取积分，再回到下一轮</text>
  <rect class="node warning" x="55" y="510" width="330" height="174" rx="18"/><text class="t" x="220" y="540">专用异常等待态</text><text class="s" x="220" y="568">黑屏：提示黑屏，持续运行等待亮屏</text><text class="s" x="220" y="592">无手机：提示无手机，持续运行等待放回</text><text class="s" x="220" y="616">截图损坏 / OCR DLL / 模型初始化异常：记录具体照片路径</text><text class="s" x="220" y="640">线程异常只影响当前设备，不连带停止其他 Worker</text><text class="s" x="220" y="664">OCR 等待时间不计入单步超时</text>
  <rect class="node warning" x="55" y="742" width="330" height="144" rx="18"/><text class="t" x="220" y="772">通用错误与熔断</text><text class="s" x="220" y="798">第 1 次错误开始保留前 10 条上下文日志和截图路径</text><text class="s" x="220" y="822">错误计数递增，尝试当前设备恢复；达到第 5 次打开熔断</text><text class="s" x="220" y="846">熔断只暂停当前设备当前 App，不影响其他 Worker</text><text class="s" x="220" y="866">停止 / 用户取消不计入错误次数</text>
  <rect class="node idle" x="55" y="944" width="330" height="110" rx="18"/><text class="t" x="220" y="974">运行状态与日志</text><text class="s" x="220" y="1000">状态栏显示步骤结果，不显示内部坐标</text><text class="s" x="220" y="1022">运行日志保留点击坐标、目标名称、OCR / 模板诊断和照片路径</text><text class="s" x="220" y="1042">平均用时、无干预时长按设备独立统计</text>

  <!-- 识别与缓存细节 -->
  <rect class="node cache" x="1200" y="190" width="330" height="142" rx="18"/><text class="t" x="1365" y="220">缓存作用域</text><text class="s" x="1365" y="246">电脑匿名 ID + 设备 ID + App</text><text class="s" x="1365" y="270">+ 机械臂透视签名</text><text class="s" x="1365" y="294">透视不变保留坐标；照片不变复用识别结果</text><text class="s" x="1365" y="316">视觉次数重启后从持久化文件继续</text>
  <rect class="node ocr" x="1200" y="370" width="330" height="150" rx="18"/><text class="t" x="1365" y="400">心遇 list 识别边界</text><text class="s" x="1365" y="426">顶部：全部消息 / 未回复 / 在线</text><text class="s" x="1365" y="450">中部：message_list，正常只扫这里</text><text class="s" x="1365" y="474">底部：消息 / 我的</text><text class="s" x="1365" y="498">导航刷新和列表 OCR 结果分开缓存</text>
  <rect class="node ocr" x="1200" y="558" width="330" height="158" rx="18"/><text class="t" x="1365" y="588">心遇 dialogue 识别边界</text><text class="s" x="1365" y="614">视觉模型给结构和系统消息判断</text><text class="s" x="1365" y="638">本地 OCR 给文字位置和竖屏 bounds</text><text class="s" x="1365" y="662">sender1 左侧 / sender2 右侧校正 chat_area</text><text class="s" x="1365" y="686">输入框位置用于确定下边界</text><text class="s" x="1365" y="708">坐标始终是竖屏归一化坐标</text>
  <rect class="node process" x="1200" y="754" width="330" height="144" rx="18"/><text class="t" x="1365" y="784">视觉模型调用限制</text><text class="s" x="1365" y="810">每个作用域最多 50 次</text><text class="s" x="1365" y="834">分析模型并行，汇总模型单独请求</text><text class="s" x="1365" y="858">次数持久化，重启不归零</text><text class="s" x="1365" y="882">额度用完转本地 OCR，其他线程继续</text>
  <rect class="node action" x="1200" y="936" width="330" height="142" rx="18"/><text class="t" x="1365" y="966">失败时的安全原则</text><text class="s" x="1365" y="992">找不到模板不猜坐标、不误点击</text><text class="s" x="1365" y="1016">动态区域无效才回退完整列表扫描</text><text class="s" x="1365" y="1040">异常截图写入 photo/errors，并记录完整路径</text><text class="s" x="1365" y="1062">配置写入使用原子写入和锁</text>

  <!-- 连线 -->
  <path class="edge" d="M785 254 L785 290"/><path class="edge" d="M785 382 L785 418"/><path class="edge" d="M785 530 L785 566"/><path class="edge" d="M785 674 L785 710"/><path class="edge" d="M785 796 L785 836"/><path class="edge" d="M785 992 L785 1030"/><path class="edge" d="M785 1140 L785 1180"/><path class="edge" d="M785 1292 L785 1332"/><path class="edge" d="M785 1488 L785 1528"/><path class="edge" d="M785 1622 L785 1664"/><path class="edge" d="M785 1820 L785 1860"/><path class="edge" d="M785 1954 L785 1996"/><path class="edge" d="M785 2152 L785 2192"/><path class="edge" d="M785 2310 L785 2350"/><path class="edge" d="M785 2462 L785 2502"/><path class="edge" d="M785 2614 L785 2654"/><path class="edge" d="M785 2766 L785 2810"/>
  <path class="soft" d="M605 1410 L385 1410 L385 403"/><text class="label" x="430" y="1392">否：暂无有效行，空闲等待</text>
  <path class="soft" d="M965 914 L1200 914"/><text class="label" x="1010" y="896">是：刷新顶部 / 底部导航</text>
  <path class="soft" d="M965 1742 L1200 1742 L1200 1130"/><text class="label" x="1010" y="1724">导航 / 列表细节</text>
  <path class="soft" d="M965 2074 L1200 2074 L1200 720"/><text class="label" x="1010" y="2056">新招呼：独立按钮分支</text>
  <path class="soft" d="M965 1400 L1115 1400 L1115 1180"/><text class="label" x="990" y="1382">是：继续目标处理</text>
  <path class="soft" d="M385 580 L440 580 L440 620 L510 620"/><text class="label" x="395" y="560">黑屏 / 无手机：等待后重试</text>
  <path class="soft" d="M385 814 L440 814 L440 914 L510 914"/><text class="label" x="395" y="796">错误：当前设备恢复 / 熔断</text>
  <path class="soft" d="M970 2842 C1060 2842 1090 2842 1090 222 C1090 222 1000 222 1000 222"/><text class="label" x="1010" y="2820">下一轮</text>
  <path class="soft" d="M1200 440 C1110 440 1110 1236 1060 1236"/><text class="label" x="1090" y="820">只提供边界信息</text>
  <path class="soft" d="M1200 636 C1120 636 1120 2248 1060 2248"/><text class="label" x="1080" y="1510">对话规则</text>
</svg>
