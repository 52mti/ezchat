<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="1960" viewBox="0 0 1480 1960" role="img" aria-labelledby="title desc">
  <title id="title">心遇 list 模式识别 / 过滤 / 拼接流程</title>
  <desc id="desc">展示心遇 list OCR 模式从原始 OCR 框、基础过滤、底部导航构建、按行分组、按行拼接、按行头识别消息行，到未读数量与好感度后处理的完整链路。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24424f"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#16313a" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg { fill: #f4efe5; }
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17333b; }
      .subtitle { font: 400 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #5c6b70; }
      .lane-title { font: 700 18px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17333b; }
      .node { filter: url(#shadow); stroke-width: 2; }
      .start { fill: #1f5a64; stroke: #173f47; }
      .process { fill: #ffffff; stroke: #78909c; }
      .ocr { fill: #ecf7f2; stroke: #3f8b72; }
      .action { fill: #fff2d8; stroke: #d09327; }
      .decision { fill: #ffffff; stroke: #b36a3c; }
      .warning { fill: #fff0ef; stroke: #c7564d; }
      .idle { fill: #eef2ff; stroke: #6477c4; }
      .end { fill: #263943; stroke: #17333b; }
      .node-text { font: 600 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #17333b; text-anchor: middle; dominant-baseline: middle; }
      .node-sub { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #4d6067; text-anchor: middle; dominant-baseline: middle; }
      .white-text { fill: #ffffff; }
      .edge { fill: none; stroke: #24424f; stroke-width: 2.4; marker-end: url(#arrow); }
      .edge-soft { fill: none; stroke: #6f7d83; stroke-width: 2; stroke-dasharray: 7 7; marker-end: url(#arrow); }
      .label { font: 700 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #24424f; paint-order: stroke; stroke: #f4efe5; stroke-width: 5; stroke-linejoin: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1480" height="1960"/>
  <text class="title" x="740" y="56" text-anchor="middle">心遇 list 模式识别 / 过滤 / 拼接流程</text>
  <text class="subtitle" x="740" y="86" text-anchor="middle">对应 apps/xinyu/ocr_config.py 的 list 配置与 vision/ocr_rules.py 中 build_list_result 的真实处理顺序</text>

  <rect x="54" y="116" width="320" height="38" rx="19" fill="#e5ecf8" stroke="#b8c4df"/>
  <text class="lane-title" x="214" y="140" text-anchor="middle">原始识别与基础过滤</text>
  <rect x="450" y="116" width="470" height="38" rx="19" fill="#e3f3eb" stroke="#a8d0bd"/>
  <text class="lane-title" x="685" y="140" text-anchor="middle">按行构建与消息行拼接</text>
  <rect x="1010" y="116" width="410" height="38" rx="19" fill="#fff0d9" stroke="#dbba83"/>
  <text class="lane-title" x="1215" y="140" text-anchor="middle">未读 / 好感度 / 心遇后处理</text>

  <!-- Main chain -->
  <g>
    <rect class="node start" x="540" y="182" width="290" height="64" rx="22"/>
    <text class="node-text white-text" x="685" y="214">进入 list 模式识别</text>
  </g>
  <g>
    <rect class="node ocr" x="505" y="288" width="360" height="98" rx="18"/>
    <text class="node-text" x="685" y="314">1. OCR 原始框转识别条目</text>
    <text class="node-sub" x="685" y="340">清洗文本、旋转到竖屏、换算上下左右与中心点坐标</text>
    <text class="node-sub" x="685" y="362">同时采样背景颜色特征，供后续红点与徽标判断</text>
  </g>
  <g>
    <rect class="node process" x="505" y="428" width="360" height="104" rx="18"/>
    <text class="node-text" x="685" y="454">2. 构建底部导航区</text>
    <text class="node-sub" x="685" y="480">根据底部区域和关键词，把底部导航与顶部筛选项提取出来</text>
    <text class="node-sub" x="685" y="502">心遇允许底部按钮文字不固定，只要位置像导航按钮就会保留</text>
  </g>
  <g>
    <rect class="node process" x="505" y="574" width="360" height="116" rx="18"/>
    <text class="node-text" x="685" y="600">3. 基础识别条目过滤</text>
    <text class="node-sub" x="685" y="626">剔除：low_confidence / box_too_short / outside_list_region / too_far_right</text>
    <text class="node-sub" x="685" y="648">box_too_short 有例外：像未读小徽标的窄框不会因此被直接丢弃</text>
    <text class="node-sub" x="685" y="670">过滤结果进入调试排除列表，保留原因与范围</text>
  </g>
  <g>
    <rect class="node process" x="505" y="732" width="360" height="92" rx="18"/>
    <text class="node-text" x="685" y="758">4. 去重与按行分组</text>
    <text class="node-sub" x="685" y="784">先去掉重叠重复框，再按纵向距离分成多行</text>
    <text class="node-sub" x="685" y="806">同一行里再按左右区域拆成左侧内容与右侧内容</text>
  </g>
  <g>
    <rect class="node process" x="505" y="866" width="360" height="112" rx="18"/>
    <text class="node-text" x="685" y="892">5. 行级文本拼接</text>
    <text class="node-sub" x="685" y="918">把一行主文本拼成左侧文本，把右侧数字或时间拼成右侧文本</text>
    <text class="node-sub" x="685" y="940">如果 left_text 为空，则丢弃该行</text>
    <text class="node-sub" x="685" y="962">如果像底部导航行或顶部系统入口，也会在这里排除</text>
  </g>
  <g>
    <rect class="node decision" x="555" y="1022" width="260" height="92" rx="20"/>
    <text class="node-text" x="685" y="1050">6. 这行像消息头吗？</text>
    <text class="node-sub" x="685" y="1076">抽出的名字要更像联系人，而不是内容、时间或导航文字</text>
    <text class="node-sub" x="685" y="1098">头行之后近距离的下一行会被当成内容行</text>
  </g>
  <g>
    <rect class="node action" x="505" y="1154" width="360" height="116" rx="18"/>
    <text class="node-text" x="685" y="1180">7. 原始行组装成消息候选</text>
    <text class="node-sub" x="685" y="1206">遇到头行就新开一条消息；后续距离够近的行并入内容区</text>
    <text class="node-sub" x="685" y="1228">如果出现新的头行且前一条已有内容，会先结束前一条消息</text>
    <text class="node-sub" x="685" y="1250">没有头行但贴近上一条消息的行，也可能并进上一条内容</text>
  </g>
  <g>
    <rect class="node action" x="505" y="1308" width="360" height="122" rx="18"/>
    <text class="node-text" x="685" y="1334">8. 生成消息列表结构</text>
    <text class="node-sub" x="685" y="1360">从头行抽出名字，并清理“附近”等名字后缀</text>
    <text class="node-sub" x="685" y="1382">把内容行清理后拼成内容；如果内容以名字开头，会去掉重复名字</text>
    <text class="node-sub" x="685" y="1404">命中排除词或掉到底部导航以下时，整条消息会被丢弃</text>
  </g>
  <g>
    <rect class="node end" x="520" y="1470" width="330" height="78" rx="22"/>
    <text class="node-text white-text" x="685" y="1498">list 结构化输出</text>
    <text class="node-sub white-text" x="685" y="1522">输出消息列表、底部导航和调试排除结果</text>
  </g>

  <!-- Left lane -->
  <g>
    <rect class="node process" x="64" y="238" width="300" height="118" rx="18"/>
    <text class="node-text" x="214" y="268">输入来源</text>
    <text class="node-sub" x="214" y="294">原图先转成竖屏统一坐标</text>
    <text class="node-sub" x="214" y="316">OCR 返回文本、置信度和方框范围</text>
    <text class="node-sub" x="214" y="338">每个识别框初始都会保留调试状态</text>
  </g>
  <g>
    <rect class="node warning" x="64" y="416" width="300" height="162" rx="18"/>
    <text class="node-text" x="214" y="446">基础过滤重点</text>
    <text class="node-sub" x="214" y="472">1. min_confidence=0.30</text>
    <text class="node-sub" x="214" y="494">2. min_box_height_ratio=0.02</text>
    <text class="node-sub" x="214" y="516">3. 只接受 main_top_ratio ~ main_bottom_ratio 的主列表区域</text>
    <text class="node-sub" x="214" y="538">4. min_x 过右（≥ 96%）的框会被丢弃</text>
    <text class="node-sub" x="214" y="560">5. 小红点数字类框允许绕过短框过滤</text>
  </g>
  <g>
    <rect class="node idle" x="64" y="640" width="300" height="128" rx="18"/>
    <text class="node-text" x="214" y="670">心遇 list 规则特化</text>
    <text class="node-sub" x="214" y="696">未读徽标位置设为左侧</text>
    <text class="node-sub" x="214" y="718">右侧数字优先归为好感度</text>
    <text class="node-sub" x="214" y="740">左侧红点默认按未读 1 条处理</text>
    <text class="node-sub" x="214" y="762">顶部“全部消息 / 全部信息 / 未回复 / 在线 / 距离”也并入底部导航结果</text>
  </g>
  <g>
    <rect class="node process" x="64" y="822" width="300" height="126" rx="18"/>
    <text class="node-text" x="214" y="852">调试输出</text>
    <text class="node-sub" x="214" y="878">被过滤的识别框、行、消息都会进入调试排除列表</text>
    <text class="node-sub" x="214" y="900">常见原因：短框、超出列表区域、误判成底部导航行</text>
    <text class="node-sub" x="214" y="922">这也是你做规则调试时最应该看的地方</text>
  </g>

  <!-- Right lane -->
  <g>
    <rect class="node action" x="1045" y="258" width="340" height="132" rx="18"/>
    <text class="node-text" x="1215" y="288">9. 提取好感度</text>
    <text class="node-sub" x="1215" y="314">当未读红点在左边时，右侧数字优先当作好感度候选</text>
    <text class="node-sub" x="1215" y="336">如果当前行没找到，还会在整条消息的右侧区域做二次扫描</text>
    <text class="node-sub" x="1215" y="358">最终取第一个可用数字作为好感度</text>
  </g>
  <g>
    <rect class="node action" x="1045" y="434" width="340" height="214" rx="18"/>
    <text class="node-text" x="1215" y="464">10. 提取未读数量</text>
    <text class="node-sub" x="1215" y="490">先看头行文字里是否带未读前缀数字</text>
    <text class="node-sub" x="1215" y="512">再看左侧 OCR 小徽标是否像未读徽标</text>
    <text class="node-sub" x="1215" y="534">如果有原图，会继续做左侧红色徽标检测</text>
    <text class="node-sub" x="1215" y="556">检测到左侧红点但没读到数字时，可回退为未读 1 条</text>
    <text class="node-sub" x="1215" y="578">必要时还会对徽标区域做二次 OCR 读取数字</text>
    <text class="node-sub" x="1215" y="600">最后若命中未读排除词，则整条未读数量会被压掉</text>
    <text class="node-sub" x="1215" y="622">心遇实际使用里，“左侧红点=未读，右侧数字=好感度”就是靠这套分流实现的</text>
  </g>
  <g>
    <rect class="node process" x="1045" y="694" width="340" height="148" rx="18"/>
    <text class="node-text" x="1215" y="724">11. 计算点击范围</text>
    <text class="node-sub" x="1215" y="750">每条消息都会重新计算点击区域</text>
    <text class="node-sub" x="1215" y="772">左边界会向外扩，右边界至少扩到接近全宽</text>
    <text class="node-sub" x="1215" y="794">下边界会结合内容底部、下一条头行位置和底部导航位置来截断</text>
    <text class="node-sub" x="1215" y="816">这就是自动化后续点击会话时使用的实际区域</text>
  </g>
  <g>
    <rect class="node idle" x="1045" y="888" width="340" height="170" rx="18"/>
    <text class="node-text" x="1215" y="918">12. 心遇 app 后处理</text>
    <text class="node-sub" x="1215" y="944">自动化会优先选未读数量大于等于 1 的目标</text>
    <text class="node-sub" x="1215" y="966">如果没有未读候选，会回退选内容非空且不是“暂无消息”等空目标</text>
    <text class="node-sub" x="1215" y="988">候选排序：好感度高优先；相同则更靠上优先</text>
    <text class="node-sub" x="1215" y="1010">最终导出姓名、好感度、未读数、内容、范围与点击坐标</text>
    <text class="node-sub" x="1215" y="1032">这一步不属于 OCR 规则本体，但直接决定 list 模式最终选谁回复</text>
  </g>
  <g>
    <rect class="node warning" x="1045" y="1114" width="340" height="168" rx="18"/>
    <text class="node-text" x="1215" y="1144">你最常遇到的几个过滤点</text>
    <text class="node-sub" x="1215" y="1170">1. 数字名字被误当成无效名字</text>
    <text class="node-sub" x="1215" y="1192">2. 底部导航被误当成消息行</text>
    <text class="node-sub" x="1215" y="1214">3. 左侧未读红点没命中，只剩右侧好感度数字</text>
    <text class="node-sub" x="1215" y="1236">4. 窄高框被 box_too_short 过滤</text>
    <text class="node-sub" x="1215" y="1258">这些都能从调试排除列表和最终消息列表里对照出来</text>
  </g>

  <!-- Arrows -->
  <path class="edge" d="M685 246 L685 288"/>
  <path class="edge" d="M685 386 L685 428"/>
  <path class="edge" d="M685 532 L685 574"/>
  <path class="edge" d="M685 690 L685 732"/>
  <path class="edge" d="M685 824 L685 866"/>
  <path class="edge" d="M685 978 L685 1022"/>
  <path class="edge" d="M685 1114 L685 1154"/>
  <path class="edge" d="M685 1270 L685 1308"/>
  <path class="edge" d="M685 1430 L685 1470"/>

  <path class="edge-soft" d="M505 336 L364 336"/>
  <path class="edge-soft" d="M505 620 L364 498"/>
  <path class="edge-soft" d="M505 778 L364 884"/>
  <path class="edge-soft" d="M865 470 L1045 324"/>
  <path class="edge-soft" d="M865 1348 L1045 516"/>
  <path class="edge-soft" d="M850 1508 L1045 962"/>
  <path class="edge-soft" d="M850 1498 L1045 780"/>
  <text class="label" x="930" y="922">消息结构输出后进入右侧后处理</text>
</svg>
